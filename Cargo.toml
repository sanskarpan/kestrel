[workspace]
resolver = "2"
members = [
    "crates/kestrel-oci",
    "crates/kestrel-ns",
    "crates/kestrel-cgroup",
    "crates/kestrel-rootfs",
    "crates/kestrel-security",
    "crates/kestrel-net",
    "crates/kestrel-image",
    "crates/kestrel-runtime",
    "crates/kestrel-init",
    "crates/kestrel-shim",
    "crates/kestreld",
    "crates/kestrel-cli",
    "crates/kestrel-tui",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
nix = { version = "0.29", default-features = false }
libc = "0.2"
rustix = "0.38"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
