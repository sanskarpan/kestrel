[package]
name = "kestrel-shim"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
# "socket" + "uio" (Phase 9 Task 16): the `seccomp.sock` listener receives
# the seccomp-notify fd via `SCM_RIGHTS` (`nix::sys::socket::{recvmsg,
# ControlMessageOwned, cmsg_space!}`) — see `daemon.rs`'s
# `recv_fd_via_scm_rights`. `recvmsg`/`ControlMessageOwned`/`cmsg_space!`
# specifically are gated behind nix's `"uio"` feature (confirmed against
# the vendored nix 0.29.0 `Cargo.toml`: `#![feature = "uio"]` on that
# module) — `"socket"` alone is NOT sufficient (real gap found via a
# `cargo build -p kestrel-shim` in isolation; a full `cargo build
# --workspace` masked it by accidentally unifying in `"uio"` from an
# unrelated crate's own feature request).
nix = { workspace = true, features = ["process", "signal", "term", "fs", "socket", "uio"] }
libc.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "signal", "fs", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
# Phase 9 Task 16: `run_notify_loop` (the seccomp-notify supervisor loop) —
# real, ready, built in Phase 5. `kestrel-shim` is the process that
# actually owns the notify fd for a container's whole lifetime (received
# via `SCM_RIGHTS` from `kestrel-init`, just before its `execve`), so it's
# the natural place to run the (blocking) supervisor loop, on a
# `spawn_blocking` task.
kestrel-security = { path = "../kestrel-security" }

[dev-dependencies]
tempfile = "3"
